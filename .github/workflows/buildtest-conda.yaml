name: bdsim build conda

on:
  workflow_dispatch:
  pull_request:
    branches:
      - 'develop'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux conda build ${{ matrix.geant4-version }} ${{ matrix.root-version }} ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        root-version: [ 6.30.04, 6.32.04, 6.34.04, 6.36.04 ]
        geant4-version: [ 10.7.3, 11.0.3, 11.1.3, 11.2.2, 11.3.1, 11.3.2, 11.4.1 ]
        python-version: [ 3.10, 3.11, 3.12, 3.13]

    steps:
      - uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}

      - name: Checkout bdsim
        uses: actions/checkout@v4
        id: checkout

      - name: Get number of CPU cores
        uses: SimenB/github-actions-cpu-cores@v2
        id: cpu-cores

      - name: Echo number of cores
        shell: bash
        run: echo "Number of cores ${{ steps.cpu-cores.outputs.count }}"

      - name: Echo compilation environment
        shell: bash
        run: |
          echo "Python version: ${{ matrix.python-version }}"
          echo "ROOT version: ${{ matrix.root-version }}"
          echo "Geant4 version: ${{ matrix.geant4-version }}"
          echo "C++ version: $(g++ --version | head -n 1)"

      - name: Install deps
        shell: bash -el {0}
        run: |
          conda install -y cmake pybdind11 
          conda install -y -c conda-forge geant4=${{ matrix.geant4-version }} root=${{ matrix.root-version }} 

name: bdsim build conda

on:
  workflow_dispatch:
  pull_request:
    branches:
      - 'develop'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux conda build ${{ matrix.geant4-version }} ${{ matrix.root-version }} ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        root-version: [ "6.30.04", "6.32.04", "6.34.04", "6.36.04" ]
        geant4-version: [ "10.7.3", "11.0.3", "11.1.3", "11.2.2", "11.3.1", "11.3.2", "11.4.1" ]
        python-version: [ "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
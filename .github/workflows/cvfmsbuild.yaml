name: cvmfs bdsim

on:
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-latest
    container: almalinux:9
    
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup CVMFS
      run: |
        dnf install -y https://cvmrepo.web.cern.ch/cvmrepo/yum/cvmfs-release-latest.noarch.rpm
	dnf install -y cvmfs 
        cvmfs_config setup

    - name: Test CernVM-FS
      run: ls /cvmfs/sft.cern.ch/


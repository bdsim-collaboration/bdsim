name: cvmfs bdsim

on:
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install CVMFS
      run: |
        sudo apt-get update
        sudo apt-get install -y cvmfs cvmfs-config-default

    - name: Configure CVMFS
      run: |
        sudo cvmfs_config setup
        sudo cvmfs_config probe
        # Example: mount CERN repo
        sudo mount -t cvmfs sw.cern.ch /cvmfs/sw.cern.ch

    - name: Check CVMFS repo access
      run: |
        ls /cvmfs/sw.cern.ch

    - name: Build software
      run: |
        # Use software/tools from CVMFS here
        export PATH=/cvmfs/sft.cern.ch/lcg/releases/gcc/11.2.0/x86_64-centos7/bin:$PATH
        gcc --version
        mkdir build
        cd build
        cmake ..
        make -j$(nproc)
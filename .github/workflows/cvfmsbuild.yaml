name: cvmfs bdsim

on:
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Setup CVMFS
      uses: cvmfs-contrib/github-action-cvmfs@v4

    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Test CernVM-FS
      run: ls /cvmfs/sft.cern.ch/

    - name: Run container
      run: |
        docker pull almalinux:9
        docker run -v /cvmfs:/cvmfs:shared -v $PWD:/repo almalinux:9 /repo/github/bin/cvmfs_build.sh


name: cvmfs bdsim

on:
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    
    strategy:
      fail-fast: false
      matrix:
        container: [almalinux8, almalinux9]

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - nmae: Install deps
      run: dnf install redhat-lsb-core
      
    - name: Setup CVMFS
      uses: cvmfs-contrib/github-action-cvmfs@v4

    - name: Test CernVM-FS
      run: ls /cvmfs/sft.cern.ch/


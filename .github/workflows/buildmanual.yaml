name: manual

on:
  workflow_dispatch:
  pull_request:
    branches:
      - 'develop'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  btlinux:
    name: build-manual
    runs-on: ubuntu-latest
    container: bdsim/alma9-g4.11.2:latest

    steps:
      - name: Checkout bdsim
        uses: actions/checkout@v4
        id: checkout

      - name: Get number of CPU cores
        uses: SimenB/github-actions-cpu-cores@v2
        id: cpu-cores

      - name: Build manual
        shell: bash
        run: |
          #
          rm -rfv /usr/local/lib/Geant4-10.7.4/Geant4PackageCache.cmake
  
          # ROOT
          source /tmp/root/bin/thisroot.sh
  
          # git trusted dir
          git config --global --add safe.directory $GITHUB_WORKSPACE
  
          # install sphinx and rtd theme 
          pip3 install sphinx sphinx-rtd-theme 
          
          # build
          mkdir /tmp/bdsim-build
          mkdir /tmp/bdsim-install
          cd /tmp/bdsim-build
          cmake -DCMAKE_INSTALL_PREFIX=/tmp/bdsim-install $GITHUB_WORKSPACE
          make manual

      - name: Upload manual
        uses: actions/upload-artifact@v4
        with:
          name: manual
          path: /tmp/bdsim-build/manual/html

  deploy:
    runs-on: ubuntu-latest
    needs: build-manual
    permissions:
      contents: write

    steps:
      - name: Download manual
        uses: actions/download-artifact@v4
        with:
          name: manual
          path: ./manual

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./manual


name: manual

on:
  workflow_dispatch:
  pull_request:
    branches:
      - 'develop'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-manual:
    name: build manual
    runs-on: ubuntu-latest
    container: bdsim/alma9-g4.11.2:latest
    permissions:
      contents: write

    steps:
      - name: Checkout bdsim
        uses: actions/checkout@v4
        id: checkout

      - name: Get number of CPU cores
        uses: SimenB/github-actions-cpu-cores@v2
        id: cpu-cores

      - name: Build manual
        shell: bash
        run: |
          #
          rm -rfv /usr/local/lib/Geant4-10.7.4/Geant4PackageCache.cmake
  
          # ROOT
          source /tmp/root/bin/thisroot.sh
  
          # git trusted dir
          git config --global --add safe.directory $GITHUB_WORKSPACE
  
          # install sphinx and rtd theme 
          pip3 install sphinx sphinx-rtd-theme 
          
          # build
          mkdir /tmp/bdsim-build
          mkdir /tmp/bdsim-install
          cd /tmp/bdsim-build
          cmake -DCMAKE_INSTALL_PREFIX=/tmp/bdsim-install $GITHUB_WORKSPACE
          make manual

      - name: Upload manual
        uses: actions/upload-artifact@v4
        with:
          name: manual
          path: /tmp/bdsim-build/manual/html

      - name: Debug secrets and vars
        run: |
          echo "Secrets set: ${{ toJson(secrets) }}"
          echo "Variables set: ${{ toJson(vars) }}"

      - name: Setup SSH known_hosts
        run: |
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          publish_dir: /tmp/bdsim-build/manual/html
          allow_empty_commit: true